---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-git-refresh
subjects:
  - kind: ServiceAccount
    name: argocd-git-refresh
    namespace: {{ .Values.argocd.namespace }}
---
# Poll git every 30s so pushes to main apply without a webhook or manual Refresh.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: argocd-git-refresh
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              oc patch argocd openshift-gitops -n openshift-gitops --type merge -p '{
                "spec": {
                  "controller": {
                    "appSync": "30s"
                  },
                  "extraConfig": {
                    "timeout.reconciliation": "30s"
                  }
                }
              }'
              echo "Argo CD git reconciliation set to 30s"
