---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    verbs: ["get", "patch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-git-refresh
subjects:
  - kind: ServiceAccount
    name: argocd-git-refresh
    namespace: {{ .Values.argocd.namespace }}
---
# Poll git every 30s so pushes to main apply without a webhook or manual Refresh.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-git-refresh
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      serviceAccountName: argocd-git-refresh
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              oc patch argocd openshift-gitops -n openshift-gitops --type json -p '[{"op":"replace","path":"/spec/controller/appSync","value":"30s"}]'
              oc patch argocd openshift-gitops -n openshift-gitops --type json -p '[{"op":"replace","path":"/spec/extraConfig/timeout.reconciliation","value":"30s"}]' \
                || oc patch argocd openshift-gitops -n openshift-gitops --type json -p '[{"op":"add","path":"/spec/extraConfig/timeout.reconciliation","value":"30s"}]'
              echo "Argo CD git reconciliation set to 30s"

              # The GitOps operator creates ArgoCDSyncAlert once (for: 5m) and does not
              # update it. OutOfSync apps page after 5 minutes even when Healthy.
              # Wait until the rule exists, then hold the alert for 15 minutes.
              rule=gitops-operator-argocd-alerts
              for i in $(seq 1 30); do
                if oc get prometheusrule "$rule" -n openshift-gitops >/dev/null 2>&1; then
                  break
                fi
                echo "Waiting for ${rule} (${i}/30)"
                sleep 10
              done
              oc get prometheusrule "$rule" -n openshift-gitops >/dev/null
              current=$(oc get prometheusrule "$rule" -n openshift-gitops -o jsonpath='{.spec.groups[0].rules[0].for}')
              if [[ "${current}" == "15m" ]]; then
                echo "ArgoCDSyncAlert already waits 15m"
              else
                oc patch prometheusrule "$rule" -n openshift-gitops --type json \
                  -p '[{"op":"replace","path":"/spec/groups/0/rules/0/for","value":"15m"}]'
                echo "ArgoCDSyncAlert now waits 15m (was ${current})"
              fi
