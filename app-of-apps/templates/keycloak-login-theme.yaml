# Login theme for the platform Keycloak realm. The background is the file
# files/keycloak-login/background.jpg. keycloak-realm-displayname mounts this
# ConfigMap and selects the theme.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-roadshow-theme
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  theme.properties: |
    parent=keycloak.v2
    styles=css/styles.css css/roadshow.css
  roadshow.css: |
    :root {
      --keycloak-bg-logo-url: url("../img/background.jpg");
    }
binaryData:
  background.jpg: {{ .Files.Get "files/keycloak-login/background.jpg" | b64enc }}
