{{- if .Values.mockMcpServers.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.mockMcpServers.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
    - group: kuadrant.io
      kind: RateLimitPolicy
      name: mcp-gateway-ratelimit
      jsonPointers:
        - /spec/limits
  destination:
    namespace: {{ .Values.mockMcpServers.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: mock-mcp-servers
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        auth:
          clusterSubdomain: {{ .Values.cluster.subdomain }}
        gateway:
          clusterSubdomain: {{ .Values.cluster.subdomain }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
