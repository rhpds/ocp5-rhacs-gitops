{{- if .Values.acs.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.acs.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.acs.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: rhacs-operator
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        acs-operator:
          namespace: {{ .Values.acs.namespace }}
          subscription:
            sourceNamespace: {{ .Values.acs.namespace }}
        acs-instance:
          clusterName: {{ .Values.acs.clusterName }}
          adminPassword: {{ .Values.acs.adminPassword }}
          clusterSubdomain: {{ .Values.cluster.subdomain }}
          routeHost: {{ .Values.acs.routeHost | default "central-reencrypt-stackrox" }}
          collector:
            nonAggregatedNetworks: "172.231.0.0/16"
  ignoreDifferences:
    - group: platform.stackrox.io
      kind: Central
      name: stackrox-central-services
      jsonPointers:
        - /spec/central/hostAliases
        - /spec/scanner/analyzer/hostAliases
        # The workshop job adds indexer hostAliases. The ACS operator then
        # fills the rest of scannerV4, which is not declared in git.
        - /spec/scannerV4
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
