{{- if .Values.demoApps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.demoApps.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: {{ .Values.demoApps.repoURL }}
      targetRevision: {{ .Values.demoApps.targetRevision }}
      path: {{ .Values.demoApps.path }}
      directory:
        recurse: true
        # CTF is maintained locally for OpenShift: the upstream manifest uses
        # an unsupported LoadBalancer service and metadata.annotation.
        exclude: '{juice-shop/**,medical-application/frontend/**,ctf-web-to-system/**}'
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      path: roadshow-ctf
  # OpenShift syncs PSA labels from the privileged SCC grant in roadshow-prereqs.
  # Ignore those labels so selfHeal does not revert enforce=restricted.
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jqPathExpressions:
        - .metadata.labels["pod-security.kubernetes.io/enforce"]
        - .metadata.labels["pod-security.kubernetes.io/enforce-version"]
        - .metadata.labels["pod-security.kubernetes.io/audit"]
        - .metadata.labels["pod-security.kubernetes.io/audit-version"]
        - .metadata.labels["pod-security.kubernetes.io/warn"]
        - .metadata.labels["pod-security.kubernetes.io/warn-version"]
        - .metadata.labels["security.openshift.io/scc.podSecurityLabelSync"]
        - .metadata.annotations["openshift.io/sa.scc.mcs"]
        - .metadata.annotations["openshift.io/sa.scc.supplemental-groups"]
        - .metadata.annotations["openshift.io/sa.scc.uid-range"]
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.clusterIP
        - .spec.clusterIPs
        - .spec.ipFamilies
        - .spec.ipFamilyPolicy
        - .spec.internalTrafficPolicy
        - .spec.sessionAffinity
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
