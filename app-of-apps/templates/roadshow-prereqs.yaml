{{- if .Values.roadshowPrereqs.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.roadshowPrereqs.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.acs.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: roadshow-prereqs
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        rhacsNamespace: {{ .Values.acs.namespace }}
        compliance:
          enabled: true
          namespace: openshift-compliance
          source: {{ include "app-of-apps.operatorSource" . }}
          sourceNamespace: openshift-marketplace
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
