{{- if .Values.openshiftLightspeedTroubleshooting.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.openshiftLightspeedTroubleshooting.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: reporting-service
      namespace: payments
      jsonPointers:
        - /spec/template/spec/containers/0/image
    - group: apps
      kind: Deployment
      name: inventory-app
      namespace: inventory
      jsonPointers:
        - /spec/template/spec/containers/0/image
    # payments is shared with demo-apps (visa-processor). Privileged SCC grant
    # syncs PSA labels; do not let this Application revert them.
    - group: ""
      kind: Namespace
      jqPathExpressions:
        - .metadata.labels["pod-security.kubernetes.io/enforce"]
        - .metadata.labels["pod-security.kubernetes.io/enforce-version"]
        - .metadata.labels["pod-security.kubernetes.io/audit"]
        - .metadata.labels["pod-security.kubernetes.io/audit-version"]
        - .metadata.labels["pod-security.kubernetes.io/warn"]
        - .metadata.labels["pod-security.kubernetes.io/warn-version"]
        - .metadata.labels["security.openshift.io/scc.podSecurityLabelSync"]
  destination:
    namespace: {{ .Values.openshiftLightspeedTroubleshooting.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: openshift-lightspeed-troubleshooting
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
