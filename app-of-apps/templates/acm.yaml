{{- if .Values.acm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.acm.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.acm.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: acm
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        # Do not use the v4.22 snapshot. ACM 5.0 is only in the live catalog.
        subscription:
          source: redhat-operators
          channel: release-5.0
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
