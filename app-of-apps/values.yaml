gitops:
  repoURL: https://github.com/rhpds/ocp5-rhacs-gitops.git
  targetRevision: main

argocd:
  namespace: openshift-gitops

# OLM catalog snapshot — v5.0 index dropped several operators we depend on
catalogSource:
  enabled: true
  name: redhat-operators-v422
  namespace: openshift-marketplace
  image: quay.io/rhpds/olm_snapshot_redhat_catalog
  tag: v4.22_2026_08_03

cluster:
  subdomain: ""
  apiServer: ""

common:
  password: ""

acs:
  enabled: true
  name: rhacs-operator
  namespace: rhacs-operator
  clusterName: local-cluster
  adminPassword: ""
  # Must match ocp5_rhacs_acs_route_host and Showroom ui-config.yml / UserInfo acs_route
  routeHost: central-reencrypt-stackrox

acsVirt:
  enabled: true
  name: rhacs-virt
  namespace: rhacs-virt

acsMicroservicesDemo:
  enabled: true
  name: rhacs-microservices-demo
  namespace: rhacs-microservices-demo

clusterObservability:
  enabled: true
  name: cluster-observability
  namespace: openshift-operators

clusterUpdate:
  enabled: true
  name: cluster-update
  namespace: openshift-cluster-version

mcpGateway:
  enabled: true
  name: mcp-gateway
  namespace: mcp-gateway

acsMcpServer:
  enabled: true
  name: rhacs-mcp-server
  namespace: rhacs-mcp

openshiftMcpServer:
  enabled: true
  name: openshift-mcp-server
  namespace: openshift-mcp

webTerminal:
  enabled: true
  name: web-terminal
  namespace: openshift-operators

quay:
  enabled: true
  name: quay
  namespace: quay
  adminUsername: admin
  # Operator-managed host prefix: registry-quay-quay.<cluster subdomain>

mockMcpServers:
  enabled: true
  name: mock-mcp-servers
  namespace: mock-mcp-servers

kialiOssm:
  enabled: true
  name: kiali-ossm
  namespace: istio-system

roadshowPrereqs:
  enabled: true
  name: roadshow-prereqs

demoApps:
  enabled: true
  name: roadshow-demo-apps
  repoURL: https://github.com/mfosterrox/demo-apps.git
  targetRevision: main
  path: kubernetes-manifests

# Lightwell TSSC workshop stack (Nexus, Gitea, RHTAS, RHTPA, Pipelines, RHDH).
# Child charts stay in rhpds/lightwell-tssc-workshop. RHACS Central and Showroom
# stay with this repo — Lightwell only adds pipeline hooks against existing Central.
lightwellTssc:
  enabled: true
  name: lightwell-tssc
  repoURL: https://github.com/rhpds/lightwell-tssc-workshop.git
  targetRevision: main
  basePath: automation/gitops


# Custom console build — was needed for EC5 to pick up the virtualized table
# layout fix (openshift/console#16798). Disabled since EC6 includes the fix.
consoleBuild:
  enabled: false
  name: console-build
  namespace: console-build

openshiftLightspeedTroubleshooting:
  enabled: true
  name: openshift-lightspeed-troubleshooting
  namespace: inventory

openshiftAgenticLightspeed:
  enabled: true
  name: openshift-agentic-lightspeed
  namespace: openshift-lightspeed
  llm:
    apiUrl: ""
    apiKey: ""
    provider: ""
    model: ""
