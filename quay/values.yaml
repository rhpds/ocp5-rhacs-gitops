subscription:
  channel: stable-3.15
  installPlanApproval: Automatic
  name: quay-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace

registry:
  name: registry

adminUsername: admin
adminPassword: ""
adminEmail: admin@example.com

# Operator-managed Route host is {name}-quay-{namespace}.{appsDomain}
# → registry-quay-quay.<cluster subdomain>. Do not set a custom hostname;
# that requires unmanaged TLS and blocked registry-quay-app-upgrade.

minio:
  rootUser: minio
  rootPassword: minio-quay-storage
  bucket: quay-datastore
  storage: 50Gi
  # quay.io/minio/minio rejects anonymous pulls. This public mirror is the
  # same MinIO server release the bastion repair script used.
  image: quay.io/thanos/minio:RELEASE.2025-09-07T16-13-09Z

workshopImages:
  enabled: true
  baseImage: docker.io/library/python:3.12-alpine3.20
  demoAppsArchive: https://github.com/mfosterrox/demo-apps/archive/refs/heads/main.tar.gz
  buildahImage: registry.redhat.io/rhel9/buildah:latest
