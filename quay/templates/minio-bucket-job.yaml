---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Regular Job, not a Sync hook. A hook that never completes (MinIO down)
    # blocks the whole Application and later git commits never apply.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      annotations:
        openshift.io/required-scc: anyuid
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: minio
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "Waiting for MinIO..."
              until mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
                sleep 5
              done
              mc mb --ignore-existing "local/{{ .Values.minio.bucket }}"
              echo "Bucket {{ .Values.minio.bucket }} ready"
