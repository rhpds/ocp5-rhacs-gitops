---
apiVersion: v1
kind: Secret
metadata:
  name: quay-config-bundle-v3
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  config.yaml: |
    FEATURE_USER_INITIALIZE: true
    BROWSER_API_CALLS_XHR_ONLY: false
    SUPER_USERS:
      - {{ .Values.adminUsername }}
    FEATURE_USER_CREATION: false
    FEATURE_ANONYMOUS_ACCESS: false
{{- if and .Values.clusterSubdomain .Values.adminPassword }}
    AUTHENTICATION_TYPE: OIDC
    # Quay 3.15 only builds an OIDC login service from a *_LOGIN_CONFIG block.
    # Flat OIDC_* keys leave oauth_login empty and the process exits with
    # "Unknown authentication type: OIDC", so the registry Route stays 503.
    KEYCLOAK_LOGIN_CONFIG:
      CLIENT_ID: quay
      CLIENT_SECRET: {{ .Values.adminPassword | quote }}
      OIDC_SERVER: https://sso.{{ .Values.clusterSubdomain }}/realms/keycloak/
      SERVICE_NAME: Keycloak
      LOGIN_SCOPES:
        - openid
        - profile
        - email
      PREFERRED_USERNAME_CLAIM_NAME: preferred_username
      VERIFIED_EMAIL_CLAIM_NAME: email
    FEATURE_DIRECT_LOGIN: true
    SERVER_HOSTNAME: registry-quay-quay.{{ .Values.clusterSubdomain }}
    PREFERRED_URL_SCHEME: https
{{- end }}
    # Serve blobs from Quay. Without this, clients follow a presigned URL to
    # the MinIO hostname. minio.<namespace>.svc is not a CoreDNS record
    # (the record is minio.<namespace>.svc.cluster.local), so kubelet and
    # buildah fail with "lookup minio.quay.svc: no such host".
    FEATURE_PROXY_STORAGE: true
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
    DISTRIBUTED_STORAGE_PREFERENCE:
      - default
    DISTRIBUTED_STORAGE_CONFIG:
      default:
        - RadosGWStorage
        - hostname: minio.{{ .Release.Namespace }}.svc.cluster.local
          is_secure: false
          port: 9000
          storage_path: /datastorage/registry
          bucket_name: {{ .Values.minio.bucket }}
          access_key: {{ .Values.minio.rootUser }}
          secret_key: {{ .Values.minio.rootPassword }}
{{- if .Values.adminPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: quay-admin-password
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  username: {{ .Values.adminUsername | quote }}
  password: {{ .Values.adminPassword | quote }}
  email: {{ .Values.adminEmail | quote }}
{{- end }}
