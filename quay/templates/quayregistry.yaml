---
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: {{ .Values.registry.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  configBundleSecret: quay-config-bundle-v3
  components:
    - kind: postgres
      managed: true
    - kind: clair
      managed: true
    - kind: redis
      managed: true
    - kind: objectstorage
      managed: false
    # Opinionated Operator Route + TLS (edge, cluster wildcard).
    # A custom hostname requires unmanaged route+tls and ssl.cert/ssl.key;
    # that combination left registry-quay-app-upgrade in Error and the
    # public Route on HTTP 503.
    - kind: route
      managed: true
    - kind: tls
      managed: true
    - kind: horizontalpodautoscaler
      managed: false
    - kind: mirror
      managed: false
    - kind: monitoring
      managed: false
