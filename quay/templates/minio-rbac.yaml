---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# The MinIO image runs as UID/GID 1000. restricted-v2 only allows the
# namespace allocated range (e.g. 1000810000-1000819999), so the default SA
# is rejected. anyuid is the OpenShift pattern for images with a fixed USER.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-scc-anyuid
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: minio
    namespace: {{ .Release.Namespace }}
