---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-acm-console-plugin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enable-acm-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get", "patch"]
  - apiGroups: ["console.openshift.io"]
    resources: ["consoleplugins"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enable-acm-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enable-acm-console-plugin
subjects:
  - kind: ServiceAccount
    name: enable-acm-console-plugin
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-acm-console-plugin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1500
  template:
    spec:
      serviceAccountName: enable-acm-console-plugin
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enable-plugin
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PLUGIN="{{ .Values.console.plugin }}"
              echo "Waiting for ConsolePlugin ${PLUGIN}"
              for _ in $(seq 1 80); do
                if oc get consoleplugin "${PLUGIN}" >/dev/null 2>&1; then
                  break
                fi
                sleep 15
              done
              oc get consoleplugin "${PLUGIN}"
              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              if [ -z "${CURRENT}" ] || [ "${CURRENT}" = "null" ]; then
                oc patch console.operator.openshift.io cluster --type json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/plugins\",\"value\":[\"${PLUGIN}\"]}]"
                echo "${PLUGIN} enabled"
              elif echo "${CURRENT}" | grep -q "\"${PLUGIN}\""; then
                echo "${PLUGIN} already enabled"
              else
                oc patch console.operator.openshift.io cluster --type json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN}\"}]"
                echo "${PLUGIN} enabled"
              fi
