apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  config.yaml: |
    enableUserWorkload: true
    alertmanagerMain:
      # Platform Alertmanager key. enableAlertmanagerConfig is only valid on
      # user-workload-monitoring-config and the admission webhook rejects it here.
      enableUserAlertmanagerConfig: true
