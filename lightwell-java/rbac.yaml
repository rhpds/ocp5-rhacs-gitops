apiVersion: v1
kind: ServiceAccount
metadata:
  name: help-im-vulnerable-release
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: help-im-vulnerable-release
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: help-im-vulnerable-release
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: help-im-vulnerable-release
subjects:
  - kind: ServiceAccount
    name: help-im-vulnerable-release
    namespace: help-im-vulnerable
---
# Docker strategy builds run privileged. The runtime Deployment stays non-root.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: help-im-vulnerable-builder-privileged
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: builder
    namespace: help-im-vulnerable
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: help-im-vulnerable-image-builder
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: builder
    namespace: help-im-vulnerable
