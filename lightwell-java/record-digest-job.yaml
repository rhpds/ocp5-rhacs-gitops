# Records the first built digest. Later attendee rebuilds move the ImageStreamTag
# and leave this ConfigMap on the original vulnerable release.
apiVersion: batch/v1
kind: Job
metadata:
  name: help-im-vulnerable-record-digest
  namespace: help-im-vulnerable
  labels:
    app.kubernetes.io/part-of: lightwell-java
    app.kubernetes.io/name: help-im-vulnerable
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lightwell-java
        app.kubernetes.io/name: help-im-vulnerable
    spec:
      serviceAccountName: help-im-vulnerable-release
      restartPolicy: Never
      containers:
        - name: record
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "-ec"]
          args:
            - |
              echo "Waiting for ImageStreamTag help-im-vulnerable:vulnerable"
              for _ in $(seq 1 180); do
                ref="$(oc -n help-im-vulnerable get istag help-im-vulnerable:vulnerable -o jsonpath='{.image.dockerImageReference}' 2>/dev/null || true)"
                if [[ "${ref}" == *"@sha256:"* ]]; then
                  echo "Recording ${ref}"
                  oc -n help-im-vulnerable create configmap help-im-vulnerable-digest \
                    --from-literal=dockerImageReference="${ref}" \
                    --dry-run=client -o yaml | oc apply -f -
                  exit 0
                fi
                sleep 10
              done
              echo "ImageStreamTag help-im-vulnerable:vulnerable has no digest yet" >&2
              exit 1
