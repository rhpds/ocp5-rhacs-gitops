{{- if .Values.collector.externalIps }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: {{ .Values.rhacsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  runtime_config.yaml: |
    networking:
      externalIps:
        enabled: ENABLED
{{- end }}
