# Platform Alertmanager skips namespaces labeled openshift.io/cluster-monitoring=true,
# which includes openshift-monitoring. A receiver in this namespace is what
# makes cluster:alertmanager_integrations:max non-zero.
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-alerting
  labels:
    app.kubernetes.io/part-of: ocp5-rhacs-roadshow
---
# Dummy webhook so AlertmanagerReceiversNotConfigured stops firing.
# The route matches an alertname that never fires, so nothing is sent.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: workshop-blackhole
  namespace: workshop-alerting
  labels:
    app.kubernetes.io/part-of: ocp5-rhacs-roadshow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  route:
    receiver: blackhole
    matchers:
      - name: alertname
        matchType: "="
        value: WorkshopBlackholeNeverFires
  receivers:
    - name: blackhole
      webhookConfigs:
        - url: http://127.0.0.1:9
          sendResolved: false
