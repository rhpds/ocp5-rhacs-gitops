rhacsNamespace: rhacs-operator

# Privileged / hostPath / SYS_ADMIN demo-apps must actually run so RHACS can
# scan them. Bindings are cluster-scoped and do not require the namespaces yet.
demoAppsScc:
  enabled: true
  serviceAccounts:
    - name: default
      namespace: medical
    - name: puppet-master
      namespace: operations
    - name: visa-processor
      namespace: payments

compliance:
  enabled: true
  namespace: openshift-compliance
  channel: stable
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace

# The audit job removes kube-apiserver unsupportedConfigOverrides.
# Insights treats that section as unsupported, and the compliance lab
# expects the platform audit rotation defaults.
auditLog:
  enabled: true

collector:
  externalIps: true
  nonAggregatedNetworks: "172.231.0.0/16"

# Master systemReserved and kubelet image GC. Applying this rolls the master
# pool once (and the worker pool once, for image GC only).
nodeCapacity:
  enabled: true
  imageGCHighThresholdPercent: 70
  imageGCLowThresholdPercent: 60
