subscription:
  source: redhat-operators
  sourceNamespace: openshift-marketplace

operators:
  namespace: openshift-operators

tempo:
  operatorNamespace: openshift-tempo-operator
  namespace: tempo
  subscription:
    source: redhat-operators-v422

istio:
  namespace: istio-system
  cniNamespace: istio-cni
  # IstioRevisionTag name. Do not pin default-v1-30-x; the operator
  # appends the active patch and a mismatch leaves image: auto unreplaced.
  revision: default

minio:
  accessKeyId: minio
  accessKeySecret: minio123
  endpoint: "http://minio:9000"
  secretName: tempostack-dev-minio
  bucketName: tempo-data

addons:
  prometheus: true

kiali:
  version: default

bookinfo:
  enabled: true
  namespace: bookinfo

trafficGenerator:
  enabled: true
  rate: "1"

eapPreconditions:
  enabled: true
