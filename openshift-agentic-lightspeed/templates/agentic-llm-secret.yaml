{{- if and .Values.agentic.enabled .Values.llm.apiUrl .Values.llm.model .Values.llm.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-creds-openai
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}
{{- end }}
