---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-credential-patcher
  namespace: openshift-cluster-version
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-credential-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["cloudcredentials"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-credential-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-credential-patcher
subjects:
  - kind: ServiceAccount
    name: cloud-credential-patcher
    namespace: openshift-cluster-version
---
# demo.redhat.com sandbox clusters do not persist the root AWS credential
# (kube-system/aws-creds) after provisioning, which causes the CCO to report
# Upgradeable=False and blocks the agentic update analysis. This Job switches
# the CCO to Manual mode and annotates it as upgradeable to clear the blocker.
apiVersion: batch/v1
kind: Job
metadata:
  name: cloud-credential-manual
  namespace: openshift-cluster-version
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        app: cloud-credential-patcher
    spec:
      serviceAccountName: cloud-credential-patcher
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Setting cloud-credential to Manual mode..."
              oc patch cloudcredential cluster --type=merge \
                -p '{"spec":{"credentialsMode":"Manual"}}'
              echo "Annotating as upgradeable to 5.1.0..."
              oc annotate cloudcredential cluster \
                cloudcredential.openshift.io/upgradeable-to="5.1.0" --overwrite
              echo "Done."
