---
apiVersion: batch/v1
kind: Job
metadata:
  name: fauxinnati
  namespace: openshift-cluster-version
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # A failed Job spec is immutable. Replace lets the next sync recreate it.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: fauxinnati
    spec:
      serviceAccountName: cluster-version-operator
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              UPSTREAM="https://fauxinnati-fauxinnati.apps.ota-stage.q2z4.p1.openshiftapps.com/api/upgrades_info/graph"
              echo "Patching ClusterVersion to set upstream and channel..."
              for attempt in 1 2 3 4 5; do
                if oc --request-timeout=15s patch clusterversion version --type json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/upstream\",\"value\":\"${UPSTREAM}\"},{\"op\":\"add\",\"path\":\"/spec/channel\",\"value\":\"simple\"}]"; then
                  echo "ClusterVersion upstream and channel set."
                  exit 0
                fi
                current_upstream="$(oc --request-timeout=15s get clusterversion version -o jsonpath='{.spec.upstream}' || true)"
                current_channel="$(oc --request-timeout=15s get clusterversion version -o jsonpath='{.spec.channel}' || true)"
                if [[ "${current_upstream}" == "${UPSTREAM}" && "${current_channel}" == "simple" ]]; then
                  echo "ClusterVersion already has the fauxinnati upstream and simple channel."
                  exit 0
                fi
                echo "Attempt ${attempt} failed; retrying..."
                sleep 5
              done
              echo "Failed to set ClusterVersion upstream and channel" >&2
              exit 1
