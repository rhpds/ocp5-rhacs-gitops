---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roxagent-bin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Copy roxagent from the installed Sensor image so the guest matches ACS 4.12
# pull-mode (mirror.openshift.com only publishes push-mode 4.11 binaries).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roxagent-bin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: roxagent-bin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: roxagent-bin
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: roxagent-bin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: roxagent-bin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: roxagent-bin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roxagent-bin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roxagent-bin
  template:
    metadata:
      labels:
        app: roxagent-bin
    spec:
      serviceAccountName: roxagent-bin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: extract
          image: registry.redhat.io/openshift4/ose-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bin
              mountPath: /work
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ACS_NS={{ .Values.acs.namespace | default "rhacs-operator" | quote }}
              echo "Waiting for Sensor in ${ACS_NS}..."
              for i in $(seq 1 60); do
                if oc -n "${ACS_NS}" get deploy sensor >/dev/null 2>&1; then
                  break
                fi
                sleep 10
              done
              oc -n "${ACS_NS}" rollout status deploy/sensor --timeout=10m
              echo "Extracting roxagent from ACS pods..."
              for deploy in sensor central; do
                for path in /stackrox/bin/roxagent /usr/local/bin/roxagent /usr/bin/roxagent; do
                  if oc -n "${ACS_NS}" exec "deploy/${deploy}" -- test -x "${path}" 2>/dev/null; then
                    oc -n "${ACS_NS}" exec "deploy/${deploy}" -- cat "${path}" > /work/roxagent
                    chmod 755 /work/roxagent
                    echo "Copied ${deploy}:${path} ($(wc -c < /work/roxagent) bytes)"
                    exit 0
                  fi
                done
              done
              echo "roxagent not found on Sensor or Central" >&2
              oc -n "${ACS_NS}" exec deploy/sensor -- ls -la /stackrox/bin /usr/local/bin 2>/dev/null || true
              exit 1
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/python-312:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: bin
              mountPath: /work
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          workingDir: /work
          command: ["python3", "-m", "http.server", "8080"]
      volumes:
        - name: bin
          emptyDir: {}
