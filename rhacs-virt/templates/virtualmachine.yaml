---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .Values.vm.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: {{ .Values.vm.name }}
      annotations:
        # Bump to recreate the VMI so cloud-init re-runs (host-path / + Satellite).
        rhacs.demo/agent: pull-serve-v2-hostpath-root
    spec:
      # Control-plane nodes on this cluster also carry the worker label, so a
      # worker nodeSelector still admits them. Require worker and reject
      # master and control-plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      domain:
        cpu:
          cores: 2
          sockets: 1
          threads: 1
        devices:
          autoattachVSOCK: true
          disks:
            - name: containerdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        memory:
          guest: 4Gi
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: {{ .Values.vm.image }}
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: {{ .Values.vm.name }}-cloudinit
