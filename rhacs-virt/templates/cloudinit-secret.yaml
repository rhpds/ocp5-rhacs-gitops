---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vm.name }}-cloudinit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  userdata: |
    #cloud-config
    user: {{ .Values.vm.user }}
    password: {{ .Values.vm.password }}
    chpasswd: { expire: false }
    runcmd:
      # 5.0.0 is not published under pub/rhacs/assets. 4.11.6 is the newest roxagent there.
      - curl -L -f -o /tmp/roxagent https://mirror.openshift.com/pub/rhacs/assets/4.11.6/bin/linux/roxagent
      - chmod +x /tmp/roxagent
      - mv /tmp/roxagent /usr/local/bin/roxagent
      - restorecon -v /usr/local/bin/roxagent
      - |
        # Baseline guest: scan the primed image as shipped. rhel-webserver
        # registers, updates, and installs extra packages so its CVE set differs.
        nohup /usr/local/bin/roxagent serve --port 818 >/var/log/roxagent.log 2>&1 &
      - echo "Setup complete"
