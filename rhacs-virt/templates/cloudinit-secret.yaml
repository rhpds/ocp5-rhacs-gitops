---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vm.name }}-cloudinit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  userdata: |
    #cloud-config
    user: {{ .Values.vm.user }}
    password: {{ .Values.vm.password }}
    chpasswd:
      expire: false
    ssh_pwauth: true
    write_files:
      - path: /etc/systemd/system/roxagent-serve.service
        content: |
          [Unit]
          Description=StackRox VM Agent - VSOCK pull server
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=root
          Restart=on-failure
          RestartSec=5s
          ExecStart=/usr/local/bin/roxagent serve --port 818 --host-path /
          StandardOutput=journal
          StandardError=journal
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - curl -k -o /tmp/katello-ca-consumer-latest.noarch.rpm https://demosat-ha.infra.demo.redhat.com/pub/katello-ca-consumer-latest.noarch.rpm
      - rpm -Uvh /tmp/katello-ca-consumer-latest.noarch.rpm
      - |
        subscription-manager register \
          --activationkey="demosat-smt-lb1161-wolfgang" \
          --org="Red_Hat_RHDP_Labs" \
          --name="{{ .Values.vm.name }}" \
          --force
      - subscription-manager release --set=9.6
      - |
        subscription-manager repos \
          --enable=rhel-9-for-x86_64-baseos-eus-rpms \
          --enable=rhel-9-for-x86_64-appstream-eus-rpms
      - dnf clean all
      - dnf update -y
      - |
        set -e
        for i in $(seq 1 36); do
          if curl -fsSL "http://roxagent-bin.{{ .Release.Namespace }}.svc:8080/roxagent" -o /usr/local/bin/roxagent; then
            break
          fi
          sleep 5
        done
        test -s /usr/local/bin/roxagent
        chmod 755 /usr/local/bin/roxagent
        restorecon -v /usr/local/bin/roxagent || true
        systemctl daemon-reload
        systemctl disable --now roxagent.timer 2>/dev/null || true
        systemctl enable --now roxagent-serve.service
