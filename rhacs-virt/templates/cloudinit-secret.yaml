---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vm.name }}-cloudinit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  userdata: |
    #cloud-config
    user: {{ .Values.vm.user }}
    password: {{ .Values.vm.password }}
    chpasswd:
      expire: false
    ssh_pwauth: true
    write_files:
      # roxagent bind-mounts a copy of the RPM database and indexes that copy.
      # A copy under /tmp is removed by systemd-tmpfiles (and /tmp is often a
      # tmpfs), so the mount goes empty and every VSOCK cycle returns no packages.
      - path: /usr/local/sbin/roxagent-prep
        permissions: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          root=/var/lib/roxagent/root
          rpm_copy=/var/lib/roxagent/rpm
          rm -rf "$root"
          mkdir -p \
            "$root/etc/pki/entitlement" \
            "$root/etc/yum.repos.d" \
            "$root/etc/yum/repos.d" \
            "$root/etc/distro.repos.d" \
            "$root/var/lib/dnf" \
            "$root/var/lib/rpm" \
            "$root/var/cache/dnf" \
            "$root/usr/lib/sysimage/libdnf5"
          touch \
            "$root/etc/os-release" \
            "$root/etc/redhat-release" \
            "$root/etc/system-release-cpe"
          rm -rf "$rpm_copy"
          mkdir -p "$rpm_copy"
          cp -a /var/lib/rpm/. "$rpm_copy/"
          chmod -R u+rwX "$rpm_copy"
          if [[ ! -s "$rpm_copy/rpmdb.sqlite" && ! -s "$rpm_copy/Packages" ]]; then
            echo "roxagent prep: $rpm_copy has no RPM database" >&2
            exit 1
          fi
      - path: /etc/tmpfiles.d/roxagent.conf
        content: |
          x /tmp/roxagent-rpm
          x /tmp/roxroot
      - path: /etc/systemd/system/roxagent-prep.service
        content: |
          [Unit]
          Description=Copy the RPM database for the StackRox VM agent
          DefaultDependencies=no
          Before=roxagent-serve.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/roxagent-prep
      - path: /etc/systemd/system/roxagent-serve.service
        content: |
          [Unit]
          Description=StackRox VM Agent - VSOCK pull server
          After=network-online.target roxagent-prep.service
          Wants=network-online.target
          Requires=roxagent-prep.service
          [Service]
          Type=simple
          User=root
          Restart=on-failure
          RestartSec=5s
          BindPaths=/var/lib/roxagent/rpm:/var/lib/roxagent/root/var/lib/rpm
          BindReadOnlyPaths=/etc/os-release:/var/lib/roxagent/root/etc/os-release
          BindReadOnlyPaths=/etc/redhat-release:/var/lib/roxagent/root/etc/redhat-release
          BindReadOnlyPaths=/etc/system-release-cpe:/var/lib/roxagent/root/etc/system-release-cpe
          BindReadOnlyPaths=/etc/yum.repos.d:/var/lib/roxagent/root/etc/yum.repos.d
          BindReadOnlyPaths=/var/cache/dnf:/var/lib/roxagent/root/var/cache/dnf
          BindReadOnlyPaths=/var/lib/dnf:/var/lib/roxagent/root/var/lib/dnf
          BindReadOnlyPaths=-/etc/pki/entitlement:/var/lib/roxagent/root/etc/pki/entitlement
          BindReadOnlyPaths=-/etc/yum/repos.d:/var/lib/roxagent/root/etc/yum/repos.d
          BindReadOnlyPaths=-/etc/distro.repos.d:/var/lib/roxagent/root/etc/distro.repos.d
          BindReadOnlyPaths=-/usr/lib/sysimage/libdnf5:/var/lib/roxagent/root/usr/lib/sysimage/libdnf5
          ExecStart=/usr/local/bin/roxagent serve --port 818 --host-path /var/lib/roxagent/root
          StandardOutput=journal
          StandardError=journal
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - |
        set -euo pipefail
        # The capsule presents its own CA. Install that RPM before register, and
        # retry: cloud-init often starts before the guest can reach Satellite.
        for i in $(seq 1 12); do
          if curl -kfsSL -o /tmp/katello-ca-consumer-latest.noarch.rpm \
              https://demosat-ha.infra.demo.redhat.com/pub/katello-ca-consumer-latest.noarch.rpm \
            && rpm -Uvh /tmp/katello-ca-consumer-latest.noarch.rpm; then
            break
          fi
          if rpm -q katello-ca-consumer; then
            break
          fi
          sleep 10
        done
        rpm -q katello-ca-consumer
        subscription-manager register \
          --activationkey="demosat-smt-lb1161-wolfgang" \
          --org="Red_Hat_RHDP_Labs" \
          --name="{{ .Values.vm.name }}" \
          --force
        subscription-manager release --set=9.6
        subscription-manager refresh
        subscription-manager repos \
          --enable=rhel-9-for-x86_64-baseos-eus-rpms \
          --enable=rhel-9-for-x86_64-appstream-eus-rpms
        dnf clean all
        dnf update -y
        for i in $(seq 1 36); do
          if curl -fsSL "http://roxagent-bin.{{ .Release.Namespace }}.svc:8080/roxagent" -o /usr/local/bin/roxagent; then
            break
          fi
          sleep 5
        done
        test -s /usr/local/bin/roxagent
        chmod 755 /usr/local/bin/roxagent
        restorecon -v /usr/local/bin/roxagent || true
        systemctl daemon-reload
        systemctl disable --now roxagent.timer 2>/dev/null || true
        systemctl enable --now roxagent-serve.service
