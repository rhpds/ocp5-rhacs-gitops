---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-vsock
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: enable-vsock
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enable-vsock
          image: registry.redhat.io/openshift4/ose-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              HCO_NS=openshift-cnv
              HCO=kubevirt-hyperconverged
              KV=kubevirt-kubevirt-hyperconverged

              vsock_enabled() {
                local gates
                gates=$(oc get kubevirt "${KV}" -n "${HCO_NS}" \
                  -o jsonpath='{.spec.configuration.developerConfiguration.featureGates[*]}' 2>/dev/null || true)
                echo "KubeVirt featureGates: ${gates:-<none>}"
                echo " ${gates} " | grep -q " VSOCK "
              }

              drop_jsonpatch() {
                oc annotate hyperconverged "${HCO}" -n "${HCO_NS}" \
                  kubevirt.kubevirt.io/jsonpatch- >/dev/null 2>&1 || true
              }

              echo "Checking VSOCK feature gate..."
              if vsock_enabled; then
                echo "VSOCK feature gate already enabled"
                drop_jsonpatch
              else
                before=$(oc get hyperconverged "${HCO}" -n "${HCO_NS}" -o jsonpath='{.spec.featureGates}' 2>/dev/null || true)
                added=false
                if [[ -z "${before}" ]]; then
                  if oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                    -p '[{"op":"add","path":"/spec/featureGates","value":[{"name":"VSOCK"}]}]'; then
                    added=true
                  fi
                elif [[ "${before}" == \[* ]]; then
                  if echo "${before}" | grep -qi '"name"[[:space:]]*:[[:space:]]*"VSOCK"'; then
                    added=true
                  elif oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                    -p '[{"op":"add","path":"/spec/featureGates/-","value":{"name":"VSOCK"}}]'; then
                    added=true
                  fi
                fi

                enabled=false
                if [[ "${added}" == true ]]; then
                  for _ in 1 2 3 4 5 6; do
                    if vsock_enabled; then
                      enabled=true
                      break
                    fi
                    sleep 5
                  done
                fi

                if [[ "${enabled}" == true ]]; then
                  echo "VSOCK enabled via spec.featureGates"
                  drop_jsonpatch
                else
                  if [[ "${added}" == true ]]; then
                    echo "VSOCK feature gate was not accepted; restoring previous featureGates"
                    if [[ -z "${before}" ]]; then
                      oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                        -p '[{"op":"remove","path":"/spec/featureGates"}]' || true
                    else
                      oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type merge \
                        -p "{\"spec\":{\"featureGates\":${before}}}" || true
                    fi
                  fi
                  echo "Enabling VSOCK via HyperConverged annotation..."
                  oc annotate hyperconverged "${HCO}" -n "${HCO_NS}" \
                    'kubevirt.kubevirt.io/jsonpatch=[{"op":"add","path":"/spec/configuration/developerConfiguration/featureGates/-","value":"VSOCK"}]' \
                    --overwrite
                fi
              fi

              # Workshop VMs use containerDisk, not HCO golden images.
              # Current HCO: spec.workloadSources.enableCommonBootImageImport
              # Older HCO: spec.enableCommonBootImageImport or spec.featureGates.enableCommonBootImageImport
              echo "Disabling common boot image import..."
              if ! oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type merge \
                -p '{"spec":{"workloadSources":{"enableCommonBootImageImport":false}}}'; then
                oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                  -p '[{"op":"replace","path":"/spec/enableCommonBootImageImport","value":false}]' 2>/dev/null \
                  || oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                  -p '[{"op":"add","path":"/spec/enableCommonBootImageImport","value":false}]' 2>/dev/null \
                  || oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                  -p '[{"op":"replace","path":"/spec/featureGates/enableCommonBootImageImport","value":false}]' 2>/dev/null \
                  || oc patch hyperconverged "${HCO}" -n "${HCO_NS}" --type json \
                  -p '[{"op":"add","path":"/spec/featureGates/enableCommonBootImageImport","value":false}]' 2>/dev/null \
                  || echo "Could not disable common boot image import (non-fatal)"
              fi

              ws=$(oc get hyperconverged "${HCO}" -n "${HCO_NS}" -o jsonpath='{.spec.workloadSources.enableCommonBootImageImport}' 2>/dev/null || true)
              old=$(oc get hyperconverged "${HCO}" -n "${HCO_NS}" -o jsonpath='{.spec.enableCommonBootImageImport}' 2>/dev/null || true)
              fg=$(oc get hyperconverged "${HCO}" -n "${HCO_NS}" -o jsonpath='{.spec.featureGates.enableCommonBootImageImport}' 2>/dev/null || true)
              echo "Boot image import flags: workloadSources=${ws:-<unset>} spec=${old:-<unset>} featureGates=${fg:-<unset>}"
              if [[ "${ws}" == "false" || "${old}" == "false" || "${fg}" == "false" ]]; then
                echo "Removing leftover DataImportCrons so CDIDataImportCronOutdated can clear..."
                oc delete dataimportcron -n openshift-virtualization-os-images --all --ignore-not-found || true
              fi
