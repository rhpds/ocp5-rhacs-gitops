---
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: {{ .Values.clusterName }}
  admissionControl:
    listenOnCreates: true
    listenOnEvents: true
    listenOnUpdates: true
  perNode:
    collector:
      collection: EBPF
      imageFlavor: Regular
    fileActivityMonitoring:
      mode: Enabled
    taintToleration: TolerateTaints
  # RHDP / workshop clusters use 172.231.0.0/16 for Services (not RFC1918).
  # Without this, the network graph treats those flows as external.
  overlays:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: collector
      patches:
        - path: spec.template.spec.containers[name:collector].env[-1]
          value: |
            name: ROX_NON_AGGREGATED_NETWORKS
            value: {{ .Values.collector.nonAggregatedNetworks | default "172.231.0.0/16" | quote }}
{{- if .Values.vmScanning.enabled }}
  customize:
    envVars:
      - name: ROX_VIRTUAL_MACHINES
        value: "true"
{{- end }}
