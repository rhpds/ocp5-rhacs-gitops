---
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  central:
    exposure:
      route:
        enabled: true
        # Passthrough (central-rhacs-operator) cannot be iframed in Showroom.
        # Reencrypt lets the router strip X-Frame-Options — same pattern as
        # ocp4_workload_rhacs_enable_reencrypt_route in the RHACS demo catalog.
        reencrypt:
          enabled: true
{{- if .Values.clusterSubdomain }}
          host: {{ .Values.routeHost | default "central-reencrypt-stackrox" }}.{{ .Values.clusterSubdomain }}
{{- end }}
      loadBalancer:
        enabled: false
      nodePort:
        enabled: false
{{- if .Values.adminPassword }}
    adminPasswordSecret:
      name: central-admin-password
{{- end }}
    # Do not set defaultTLSSecret to the cluster wildcard cert. That cert's
    # SAN is *.apps.<cluster> and the router health-checks Central as
    # central.<ns>.svc, so the reencrypt route (needed to iframe ACS in
    # Showroom) returns 503. The router already presents a trusted cert to
    # the browser on reencrypt.
    persistence:
      persistentVolumeClaim:
        claimName: stackrox-db
    # Workshop workers cannot hold default ACS HA requests plus one node loss
    # (KubeMemoryOvercommit). Keep limits high enough for labs; cut requests.
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    db:
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 4Gi
{{- if .Values.vmScanning.enabled }}
  customize:
    envVars:
      - name: ROX_VIRTUAL_MACHINES
        value: "true"
      - name: ROX_INIT_CONTAINER_SUPPORT
        value: "true"
      - name: ROX_POLICY_FILTERS_UI
        value: "true"
{{- end }}
  egress:
    connectivityPolicy: Online
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        maxReplicas: 1
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1500Mi
        limits:
          cpu: "1"
          memory: 3Gi
    db:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
    scannerComponent: Enabled
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 4Gi
    matcher:
      scaling:
        autoScaling: Disabled
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 4Gi
    db:
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 4Gi
