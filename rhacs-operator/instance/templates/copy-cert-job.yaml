---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-ingress-cert
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: copy-ingress-cert
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy-cert
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Skipping copy of the default ingress cert into central-default-tls-cert."
              echo "That secret makes Central serve *.apps, and the reencrypt route then 503s"
              echo "because the router health-checks central.<namespace>.svc."
              exit 0
