---
# Reconcile independently of the RHACS install duration. A failed run must not
# permanently strand MCP when Central becomes ready after Argo's hook retries.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copy-central-ca
  namespace: {{ .Values.targetNamespace }}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: copy-central-ca
          restartPolicy: Never
          containers:
            - name: copy-ca
              image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  SOURCE_NS="{{ .Values.acsNamespace }}"
                  TARGET_NS="{{ .Values.targetNamespace }}"
                  SOURCE_SECRET="{{ .Values.sourceSecret }}"
                  TARGET_SECRET="{{ .Values.targetSecret }}"
                  SOURCE_KEY="{{ .Values.sourceKey }}"
                  workdir=$(mktemp -d)
                  trap 'rm -rf "$workdir"' EXIT

                  echo "Reconciling Central CA from ${SOURCE_NS}/${SOURCE_SECRET}..."
                  if ! oc extract secret/"${SOURCE_SECRET}" -n "${SOURCE_NS}" \
                    --keys="${SOURCE_KEY}" --to="$workdir" --confirm --request-timeout=15s \
                    || [ ! -s "$workdir/${SOURCE_KEY}" ]; then
                    echo "Central CA not ready; the next scheduled run will retry."
                    exit 1
                  fi

                  oc create secret generic "${TARGET_SECRET}" -n "${TARGET_NS}" \
                    --from-file="ca.crt=$workdir/${SOURCE_KEY}" \
                    --dry-run=client -o yaml | oc apply --request-timeout=15s -f -
                  echo "Central CA reconciled successfully"
