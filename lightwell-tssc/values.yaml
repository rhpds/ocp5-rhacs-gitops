# Child charts stay in https://github.com/rhpds/lightwell-tssc-workshop
# (automation/gitops/components/*). This chart only creates Argo Applications.
#
# RHACS Central/operator and Showroom are owned by the roadshow app-of-apps.
# The Lightwell RHACS Application is hooks-only (Tekton tasks + CI token).

gitops:
  repoUrl: https://github.com/rhpds/lightwell-tssc-workshop.git
  revision: main
  basePath: automation/gitops

argocd:
  namespace: openshift-gitops
  project: default

operator:
  source: redhat-operators
  sourceNamespace: openshift-marketplace

deployer:
  domain: ""
  apiUrl: ""

# Sized for 3×64Gi catalog workers so ACS/TPA/Nexus are not squeezed.
resources:
  rhtpa:
    cpu: "500m"
    memory: 8Gi
  nexus:
    cpu: 500m
    memoryRequest: 2Gi
    memoryLimit: 4Gi
    javaOpts: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g"
  keycloak:
    cpu: 500m
    memoryRequest: 1Gi
    memoryLimit: 2Gi

# Optional. When set (RHDP common_password), Gitea student and TSSC Keycloak
# workshop users match the cluster password shown on the Showroom Welcome page.
student:
  password: ""

components:
  keycloak:
    enabled: true
    namespace: sso
    syncWave: "5"
    # RHDP authentication already owns sso.<domain> (RHBK, realm keycloak).
    # TSSC Keycloak must use a distinct Route host or /realms/tpa 404s.
    routeHostPrefix: sso-tpa
    realm: tpa

  pipelines:
    enabled: true
    namespace: openshift-operators
    syncWave: "8"

  rhtas:
    enabled: true
    namespace: trusted-artifact-signer
    syncWave: "10"

  rhtpa:
    enabled: true
    namespace: trusted-profile-analyzer
    syncWave: "10"

  # Reuse the roadshow Central in rhacs-operator. Do not install a second ACS.
  rhacs:
    enabled: true
    namespace: rhacs-operator
    installOperator: false
    installCentral: false
    installSecuredCluster: false
    syncWave: "10"

  admission:
    enabled: true
    namespace: tssc-admission
    syncWave: "10"

  networkPolicy:
    enabled: true
    namespace: lw-poc-build
    syncWave: "10"

  gitea:
    enabled: true
    namespace: gitea
    syncWave: "15"
    studentUsername: student
    repoName: spring-boot-lw-poc
    repoRevision: main
    pomPath: pom.xml
    pythonRepoName: fastapi-lw-poc

  lightwellRepo:
    enabled: true
    namespace: lightwell-repo
    syncWave: "20"
    chartPath: lightwell-repo

  renovate:
    enabled: true
    namespace: renovate
    syncWave: "25"

  rhdh:
    enabled: true
    namespace: rhdh
    syncWave: "30"

  springBootLwPoc:
    enabled: false
    namespace: spring-boot-lw-poc
    syncWave: "40"
    chartPath: spring-boot-lw-poc

  fastapiLwPoc:
    enabled: false
    namespace: fastapi-lw-poc
    syncWave: "40"
    chartPath: fastapi-lw-poc

  parasolApp:
    enabled: false
    namespace: parasol
    syncWave: "40"
    chartPath: parasol-app

  validateJobs:
    enabled: true
    namespace: lw-poc-validate
    syncWave: "45"

  # Roadshow already deploys Showroom from ocp5-rhacs-showroom.
  showroom:
    enabled: false
    namespace: showroom
    name: showroom
    syncWave: "50"
    content:
      repoUrl: https://github.com/rhpds/ocp5-rhacs-showroom.git
      repoRef: main
      antoraPlaybook: site.yml
      image: quay.io/rhpds/showroom-content:v1.3.1
    nookbag:
      enabled: true
      bundleUrl: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip
    terminal:
      enabled: true
      image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
      labClusterAccess: true
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
