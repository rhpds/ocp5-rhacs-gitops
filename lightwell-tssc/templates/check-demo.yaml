# Practice Check for the TSSC overview. Report-token only. Does not grade 1.1.
{{- if .Values.components.validateJobs.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.components.validateJobs.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: validate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-00-check-demo
  namespace: {{ .Values.components.validateJobs.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: report
    app.kubernetes.io/name: validate-jobs
    tssc.workshop/module: "00"
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  module: "00"
  title: How checks work
  check_flow: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: validate-job-demo-templates
  namespace: {{ .Values.components.validateJobs.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-templates
    app.kubernetes.io/name: validate-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  job-00.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: validate-00-check-demo
      namespace: {{ .Values.components.validateJobs.namespace }}
      labels:
        app.kubernetes.io/name: validate-jobs
        app.kubernetes.io/component: validate
        tssc.workshop/module: "00"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: validate-jobs
            app.kubernetes.io/component: validate
            tssc.workshop/module: "00"
        spec:
          restartPolicy: Never
          serviceAccountName: validate-jobs
          containers:
            - name: check
              image: registry.redhat.io/openshift4/ose-cli:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
                - |
                  echo "=== Validate Job 00. How checks work ==="
                  TOKEN="$(oc -n lw-poc-validate get configmap report-00-check-demo -o jsonpath='{.data.check_flow}' 2>/dev/null || true)"
                  if [[ -z "${TOKEN}" || "${TOKEN}" == "REPLACE_ME" ]]; then
                    echo "CHECK FAILED: report-00-check-demo key check_flow is still REPLACE_ME. Set it to checks-work, then re-run this Job."
                    exit 1
                  fi
                  if [[ "${TOKEN}" != "checks-work" ]]; then
                    echo "CHECK FAILED: report-00-check-demo key check_flow must be checks-work (got '${TOKEN}')."
                    exit 1
                  fi
                  echo "CHECK PASSED: report token is set. Lab Checks use this same Job flow."
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
{{- end }}
